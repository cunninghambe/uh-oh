name: CI

on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # pnpm must be set up before actions/setup-node when using its
      # built-in pnpm store cache (cache: 'pnpm' below) — setup-node needs
      # `pnpm` on PATH to resolve the cache config.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          # Root package.json intentionally has no "packageManager" field
          # (out of infra's lane to add), so pin the version here instead.
          # Matches the pnpm actually used on the dev machine (11.x).
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Test
        run: pnpm test

      - name: Build web (verifies production build succeeds)
        run: pnpm --filter @uh-oh/web build

      - name: Unit test scripts/ (node:test — no vitest dep at the repo root)
        run: node --test scripts/build-sdk-dist.test.mjs scripts/vendor-js-client.test.mjs scripts/build-js-dist.test.mjs scripts/build-mcp-dist.test.mjs scripts/vendor-sourcemap-uploader.test.mjs

      # shellcheck ships preinstalled on the ubuntu-latest runner image, but
      # install explicitly anyway so this step doesn't silently start
      # skipping real checks if a future runner image drops it.
      - name: shellcheck infra/*.sh
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y shellcheck
          bash infra/test.sh

  e2e:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Compiles-cleanly gate for @uh-oh/server (the main `ci` job above never builds it).
      # The e2e run itself boots the server via `tsx` against source, not this dist output —
      # see packages/web/e2e/server-runner.ts for why — but this still catches a broken build.
      - name: Build server
        run: pnpm --filter @uh-oh/server build

      # Also done inside packages/web/e2e/global-setup.ts (it runs `vite build` itself right
      # before `vite preview`), but kept here too as a fast, clearly-labeled CI gate.
      - name: Build web
        run: pnpm --filter @uh-oh/web build

      - name: Install Playwright's chromium
        run: pnpm --filter @uh-oh/web exec playwright install --with-deps chromium

      - name: Run e2e suite
        run: pnpm --filter @uh-oh/web e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: packages/web/build/playwright-report/
          retention-days: 7

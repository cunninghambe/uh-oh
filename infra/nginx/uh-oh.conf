# /etc/nginx/sites-available/uh-oh.conf  (symlinked from sites-enabled)
# Placeholder UH_OH_DOMAIN is replaced by setup-tls.sh before installation.
#
# rate limit zones (backstop, not the primary defense — the server already
# does its own per-IP and per-(publicKey,fingerprint) rate limiting; this
# just keeps nginx itself from being overwhelmed before a request even
# reaches Node):
#   uh_oh_login:   tight — login is a low-volume, high-value brute-force target.
#   uh_oh_ingest:  generous — crash storms (many devices crashing on the same
#                  bug at once) are legitimate traffic, this is only a backstop.
limit_req_zone $binary_remote_addr zone=uh_oh_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=uh_oh_ingest:10m rate=50r/s;

server {
  listen 80;
  listen [::]:80;
  server_name UH_OH_DOMAIN;

  # certbot HTTP-01 challenge
  location /.well-known/acme-challenge/ {
    root /var/www/letsencrypt;
  }

  # Everything else → HTTPS
  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name UH_OH_DOMAIN;

  ssl_certificate     /etc/letsencrypt/live/UH_OH_DOMAIN/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/UH_OH_DOMAIN/privkey.pem;
  ssl_session_timeout 1d;
  ssl_session_cache   shared:UhOhSSL:50m;
  ssl_session_tickets off;
  ssl_protocols       TLSv1.3 TLSv1.2;
  ssl_prefer_server_ciphers off;

  # Security headers
  add_header Strict-Transport-Security "max-age=63072000" always;
  add_header X-Content-Type-Options    nosniff always;
  add_header X-Frame-Options           DENY always;
  add_header Referrer-Policy           strict-origin-when-cross-origin always;
  add_header Content-Security-Policy   "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'" always;

  # Upload + payload limits (symbol files can be large)
  client_max_body_size 50m;

  # gzip compression for text assets
  gzip            on;
  gzip_vary       on;
  gzip_min_length 1024;
  gzip_types      text/plain text/css text/javascript application/javascript application/json image/svg+xml;

  # Dashboard SPA served directly by nginx
  root  /opt/uh-oh/packages/web/dist;
  index index.html;

  # SPA fallback — unknown paths return index.html for client-side routing
  location / {
    try_files $uri $uri/ /index.html;
  }

  # index.html must never be cached — it's the one file whose staleness
  # actually breaks the app (it references content-hashed asset filenames
  # from the build that produced it; a cached stale index.html can point at
  # assets a later deploy has already deleted). This also catches the
  # /index.html the SPA fallback above serves, since nginx re-matches
  # locations on that internal redirect.
  location = /index.html {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  # Static assets — immutable long-cache (Vite content-hashes filenames)
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Login → Node. Separate location (instead of folded into /api/) so it can
  # carry its own tight rate limit — this is the highest-value brute-force
  # target behind /api/.
  location = /api/auth/login {
    limit_req           zone=uh_oh_login burst=5;
    proxy_pass          http://127.0.0.1:3300;
    proxy_set_header    Host              $host;
    # Overwrite, not append: nginx is the only hop between the internet and
    # this server, so $remote_addr is the true client IP. Using
    # $proxy_add_x_forwarded_for here would instead APPEND to any
    # X-Forwarded-For the client already sent, letting a client spoof an
    # arbitrary "trusted" IP in front of its own — the server only trusts
    # loopback proxies, so it must see nginx's own view of the client IP.
    proxy_set_header    X-Forwarded-For   $remote_addr;
    proxy_set_header    X-Forwarded-Proto $scheme;
    proxy_set_header    X-Real-IP         $remote_addr;
    proxy_read_timeout  60s;
  }

  # API → Node (Fastify on 127.0.0.1:3300)
  location /api/ {
    proxy_pass         http://127.0.0.1:3300;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Forwarded-For   $remote_addr;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_read_timeout 60s;
  }

  # MCP (Streamable HTTP) → Node. JWT-gated exactly like /api/ (Authorization:
  # Bearer). Mirrors the /api/ proxy config but caps the body at 1m: MCP request
  # bodies are small JSON-RPC envelopes, not the multi-MB symbol uploads that
  # justify /api/'s 50m ceiling.
  location = /mcp {
    client_max_body_size 1m;
    proxy_pass         http://127.0.0.1:3300;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Forwarded-For   $remote_addr;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_read_timeout 60s;
  }

  # Ingest → Node. Crash payloads are small JSON envelopes, not file
  # uploads — 1m is generous headroom over a typical envelope while still
  # being far below the 50m symbol-upload cap /api/ allows, so a malicious
  # or misbehaving client can't tie up an ingest worker streaming a huge body.
  location /ingest/ {
    limit_req           zone=uh_oh_ingest burst=100 nodelay;
    client_max_body_size 1m;
    proxy_pass         http://127.0.0.1:3300;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Forwarded-For   $remote_addr;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_read_timeout 30s;
  }

  # Health check — proxied, access log suppressed to reduce noise
  location = /healthz {
    proxy_pass http://127.0.0.1:3300/healthz;
    access_log off;
  }

  # Metrics — localhost only
  location = /metrics {
    allow 127.0.0.1;
    deny  all;
    proxy_pass http://127.0.0.1:3300/metrics;
  }
}

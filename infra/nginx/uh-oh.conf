# /etc/nginx/sites-available/uh-oh.conf  (symlinked from sites-enabled)
# Placeholder UH_OH_DOMAIN is replaced by setup-tls.sh before installation.

server {
  listen 80;
  listen [::]:80;
  server_name UH_OH_DOMAIN;

  # certbot HTTP-01 challenge
  location /.well-known/acme-challenge/ {
    root /var/www/letsencrypt;
  }

  # Everything else → HTTPS
  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name UH_OH_DOMAIN;

  ssl_certificate     /etc/letsencrypt/live/UH_OH_DOMAIN/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/UH_OH_DOMAIN/privkey.pem;
  ssl_session_timeout 1d;
  ssl_session_cache   shared:UhOhSSL:50m;
  ssl_session_tickets off;
  ssl_protocols       TLSv1.3 TLSv1.2;
  ssl_prefer_server_ciphers off;

  # Security headers
  add_header Strict-Transport-Security "max-age=63072000" always;
  add_header X-Content-Type-Options    nosniff always;
  add_header X-Frame-Options           DENY always;
  add_header Referrer-Policy           strict-origin-when-cross-origin always;
  add_header Content-Security-Policy   "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'" always;

  # Upload + payload limits (symbol files can be large)
  client_max_body_size 50m;

  # gzip compression for text assets
  gzip            on;
  gzip_vary       on;
  gzip_min_length 1024;
  gzip_types      text/plain text/css text/javascript application/javascript application/json image/svg+xml;

  # Dashboard SPA served directly by nginx
  root  /opt/uh-oh/packages/web/dist;
  index index.html;

  # SPA fallback — unknown paths return index.html for client-side routing
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Static assets — immutable long-cache (Vite content-hashes filenames)
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # API → Node (Fastify on 127.0.0.1:3300)
  location /api/ {
    proxy_pass         http://127.0.0.1:3300;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_read_timeout 60s;
  }

  # Ingest → Node
  location /ingest/ {
    proxy_pass         http://127.0.0.1:3300;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_read_timeout 30s;
  }

  # Health check — proxied, access log suppressed to reduce noise
  location = /healthz {
    proxy_pass http://127.0.0.1:3300/healthz;
    access_log off;
  }

  # Metrics — localhost only
  location = /metrics {
    allow 127.0.0.1;
    deny  all;
    proxy_pass http://127.0.0.1:3300/metrics;
  }
}
